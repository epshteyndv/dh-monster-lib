# Дополнительные карточки (было в корневом data/monsters.yaml).

monsters:
  - id: shadow-wisp
    name: SHADOW WISP
    tier: 1
    role: Horde
    flavor: A flicker of dark energy that hungers for warmth.
    motives: Harass, obscure, drain
    experience:
      - Darkvision +2
    stats:
      difficulty: 10
      thresholds: "5/12"
      hp: 4
      stress: 2
      attack:
        atk: 2
        name: Touch
        range: Close
        damage: 1d8+1 mag
    features:
      - name: Flicker
        type: passive
        description: The wisp may move through solid objects while in darkness.
      - name: Chill
        type: action
        description: Deal 1d6 magic damage to a target within Close range.
